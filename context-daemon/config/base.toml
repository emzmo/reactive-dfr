# base.toml — global config for reactive-dfr
# Layer 0 is injected by the context daemon (context buttons + minipanel).
# Layers 1+ are fixed: F-keys (fn), system monitor (swipe).

LayerSwipe = true
ScrollLoop = true
AdaptiveBrightness = false
ActiveBrightness = 75
DimTimeout = 30
OffTimeout = 60

# Screensaver mode: after this many seconds of Touch Bar inactivity,
# the ScreensaverLayer is shown. 0 disables. A state file must exist
# at ~/.config/reactive-dfr/state/screensaver_enabled for it to activate.
ScreensaverTimeout = 30
ScreensaverBrightness = 100

# Screensaver layer: shown when the Touch Bar has been idle.
# Must contain a button with Action = "ExitScreensaver" to exit via tap.
ScreensaverLayer = [
  { Text = "esc", Action = "Esc", Pinned = true, OnClick = "Action", Stretch = 1 },
  { Command = "python3 ~/.config/reactive-dfr/widgets/feeder.py", Interval = 5, Stretch = 10, OnClick = "sh ~/.config/reactive-dfr/widgets/feeder_click.sh" },
  { Text = "X", Action = "ExitScreensaver", Pinned = true, Stretch = 1 },
]

# Minipanel: buttons always visible at the right edge of layer 0,
# regardless of which app context is active. Edit, reorder, add,
# or remove buttons here to customize the always-on controls.
Minipanel = [
  { Icon = "volume_up", SliderGet = "wpctl get-volume @DEFAULT_AUDIO_SINK@ | awk '{print int($2*100) ($3==\"[MUTED]\" ? \" muted\" : \"\")}'", SliderSet = "wpctl set-volume -l 1.0 @DEFAULT_AUDIO_SINK@ {}%", SliderMute = "wpctl set-mute @DEFAULT_AUDIO_SINK@ {}", SliderMuteIcon = "volume_off", SliderLowIcon = "volume_down", SliderStretch = 3 },
  { Icon = "brightness_high", SliderGet = "brightnessctl -d acpi_video0 -m | awk -F, '{print $4}' | tr -d '%'", SliderSet = "systemd-run --user brightnessctl -d acpi_video0 set $(({} > 0 ? {} : 1))%", SliderStretch = 3 },
  { Icon = "backlight_high", SliderGet = "brightnessctl -d 'spi::kbd_backlight' -m | awk -F, '{print $4}' | tr -d '%'", SliderSet = "systemd-run --user brightnessctl -d 'spi::kbd_backlight' set {}%", SliderStretch = 3 },
]

# Fixed layers (layer 0 is replaced by the context daemon)
Layers = [
  # Layer 1 (index 1): F-keys — shown when fn is held
  [
    { Text = "esc", Action = "Esc", Pinned = true, OnClick = "Action" },
    { Text = "F1", Action = "F1", OnClick = "Action" },
    { Text = "F2", Action = "F2", OnClick = "Action" },
    { Text = "F3", Action = "F3", OnClick = "Action" },
    { Text = "F4", Action = "F4", OnClick = "Action" },
    { Text = "F5", Action = "F5", OnClick = "Action" },
    { Text = "F6", Action = "F6", OnClick = "Action" },
    { Text = "F7", Action = "F7", OnClick = "Action" },
    { Text = "F8", Action = "F8", OnClick = "Action" },
    { Text = "F9", Action = "F9", OnClick = "Action" },
    { Text = "F10", Action = "F10", OnClick = "Action" },
    { Text = "F11", Action = "F11", OnClick = "Action" },
    { Text = "F12", Action = "F12", OnClick = "Action" },
  ],
  # Layer 2 (index 2): System monitor + widgets
  [
    { Text = "esc", Action = "Esc", Pinned = true, OnClick = "Action" },
    { Cpu = "celsius", Stretch = 2 },
    { Gpu = "celsius", Stretch = 2 },
    { Battery = "both", Stretch = 2 },
    { Time = "%H:%M", Stretch = 2 },
    { Command = "sh ~/.config/reactive-dfr/widgets/ip.sh", Interval = 30, Stretch = 2, OnClick = "sh ~/.config/reactive-dfr/widgets/copy_ip.sh" },
    { Command = "sh ~/.config/reactive-dfr/widgets/cpu.sh", Interval = 3, Stretch = 2, OnClick = "Expand", ExpandCommand = "sh ~/.config/reactive-dfr/widgets/cpu_expand.sh", ExpandStretch = 4 },
  ],
]

[Style]
Background = "#0d0d0d"
ButtonColor = "#1a1a2e"
ButtonColorActive = "#4a4a6e"
TextColor = "#e0e0e0"
ButtonSpacing = 12
EdgePadding = 4
CornerRadius = 10
FontSize = 28
IconSize = 44
HeightPercent = 88
BatteryChargingColor = "#00cc44"
BatteryLowColor = "#cc3333"
