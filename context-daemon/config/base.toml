# base.toml — global config for reactive-dfr
# Layer 0 is injected by the context daemon (context buttons + minipanel).
# Layers 1+ are fixed: F-keys (fn), system monitor (swipe).

LayerSwipe = true
ScrollLoop = true
AdaptiveBrightness = false
ActiveBrightness = 128
DimTimeout = 30
OffTimeout = 60

# Fixed layers (layer 0 is replaced by the context daemon)
Layers = [
  # Layer 1 (index 1): F-keys — shown when fn is held
  [
    { Text = "esc", Action = "Esc", Pinned = true, OnClick = "Action" },
    { Text = "F1", Action = "F1", OnClick = "Action" },
    { Text = "F2", Action = "F2", OnClick = "Action" },
    { Text = "F3", Action = "F3", OnClick = "Action" },
    { Text = "F4", Action = "F4", OnClick = "Action" },
    { Text = "F5", Action = "F5", OnClick = "Action" },
    { Text = "F6", Action = "F6", OnClick = "Action" },
    { Text = "F7", Action = "F7", OnClick = "Action" },
    { Text = "F8", Action = "F8", OnClick = "Action" },
    { Text = "F9", Action = "F9", OnClick = "Action" },
    { Text = "F10", Action = "F10", OnClick = "Action" },
    { Text = "F11", Action = "F11", OnClick = "Action" },
    { Text = "F12", Action = "F12", OnClick = "Action" },
  ],
  # Layer 2 (index 2): System monitor + widgets
  [
    { Text = "esc", Action = "Esc", Pinned = true, OnClick = "Action" },
    { Cpu = "celsius", Stretch = 2 },
    { Gpu = "celsius", Stretch = 2 },
    { Battery = "both", Stretch = 2 },
    { Time = "%H:%M", Stretch = 2 },
    { Command = "sh ~/.config/reactive-dfr/widgets/ip.sh", Interval = 30, Stretch = 2, OnClick = "sh ~/.config/reactive-dfr/widgets/copy_ip.sh" },
    { Command = "sh ~/.config/reactive-dfr/widgets/cpu.sh", Interval = 3, Stretch = 2, OnClick = "Expand", ExpandCommand = "sh ~/.config/reactive-dfr/widgets/cpu_expand.sh", ExpandStretch = 4 },
  ],
]

[Style]
Background = "#0d0d0d"
ButtonColor = "#1a1a2e"
ButtonColorActive = "#4a4a6e"
TextColor = "#e0e0e0"
ButtonSpacing = 12
EdgePadding = 4
CornerRadius = 10
FontSize = 28
IconSize = 44
HeightPercent = 88
BatteryChargingColor = "#00cc44"
BatteryLowColor = "#cc3333"