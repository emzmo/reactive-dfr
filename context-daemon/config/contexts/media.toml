# media.toml — media players: playback, volume slider, brightness
# Replaces layer 0 when a media player window is active.

[[layer]]
Text = "esc"
Action = "Esc"
Pinned = true
OnClick = "Action"

[[layer]]
Icon = "fast_rewind"
Action = "PreviousSong"
OnClick = "Action"

[[layer]]
Icon = "play_pause"
Action = "PlayPause"
OnClick = "Action"

[[layer]]
Icon = "fast_forward"
Action = "NextSong"
OnClick = "Action"

[[layer]]
Icon = "volume_up"
SliderGet = "wpctl get-volume @DEFAULT_AUDIO_SINK@ | awk '{print int($2*100) ($3==\"[MUTED]\" ? \" muted\" : \"\")}'"
SliderSet = "wpctl set-volume -l 1.0 @DEFAULT_AUDIO_SINK@ {}%"
SliderMute = "wpctl set-mute @DEFAULT_AUDIO_SINK@ {}"
SliderMuteIcon = "volume_off"
SliderLowIcon = "volume_down"
SliderStretch = 3

[[layer]]
Icon = "brightness_low"
Action = "BrightnessDown"
OnClick = "Action"

[[layer]]
Icon = "brightness_high"
Action = "BrightnessUp"
OnClick = "Action"