# screenshot.toml — Screenshot utilities
# Region, window, full screen, with clipboard/file toggle

[[layer]]
Text = "FULL"
Action = "Print"
OnClick = "Action"

[[layer]]
Text = "AREA"
Action = [ "LeftShift", "Print" ]
OnClick = "Action"

[[layer]]
Text = "WIN"
Action = [ "LeftAlt", "Print" ]
OnClick = "Action"

[[layer]]
Text = "CLIP"
Action = [ "LeftCtrl", "Print" ]
OnClick = "Action"

[[layer]]
Text = "DLAY"
Action = [ "LeftCtrl", "LeftShift", "Print" ]
OnClick = "Action"

[[layer]]
Text = "SAVE"
Action = [ "LeftCtrl", "S" ]
OnClick = "Action"

[[layer]]
Text = "COPY"
Action = [ "LeftCtrl", "C" ]
OnClick = "Action"

[[layer]]
Text = "PSTE"
Action = [ "LeftCtrl", "V" ]
OnClick = "Action"

[[layer]]
Text = "ESC"
Action = "Esc"
OnClick = "Action"

[[layer]]
Text = "F11"
Action = "F11"
OnClick = "Action"

[[layer]]
Text = "F12"
Action = "F12"
OnClick = "Action"

[[layer]]
Text = "PWR"
Action = "Power"
OnClick = "Action"