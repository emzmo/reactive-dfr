# aseprite.toml — Aseprite pixel art editor
# Design-specific controls: undo/redo, brush, eraser, layers, palette, color
#
# Slide gestures (Phase 3.4) can be assigned to brush_size, opacity, color
# via the extended ButtonConfig fields when available.

[[layer]]
Text = "↶"
Action = [ "LeftCtrl", "Z" ]
OnClick = "Action"

