# virtual-desktops.toml — Workspace / virtual desktop management
# Move between workspaces, move windows, launch

[[layer]]
Text = "D1"
Action = [ "LeftCtrl", "LeftAlt", "1" ]
OnClick = "Action"

[[layer]]
Text = "D2"
Action = [ "LeftCtrl", "LeftAlt", "2" ]
OnClick = "Action"

[[layer]]
Text = "D3"
Action = [ "LeftCtrl", "LeftAlt", "3" ]
OnClick = "Action"

[[layer]]
Text = "D4"
Action = [ "LeftCtrl", "LeftAlt", "4" ]
OnClick = "Action"

[[layer]]
Text = "←"
Action = [ "LeftCtrl", "LeftAlt", "Left" ]
OnClick = "Action"

[[layer]]
Text = "→"
Action = [ "LeftCtrl", "LeftAlt", "Right" ]
OnClick = "Action"

[[layer]]
Text = "MV←"
Action = [ "LeftCtrl", "LeftShift", "Left" ]
OnClick = "Action"

[[layer]]
Text = "MV→"
Action = [ "LeftCtrl", "LeftShift", "Right" ]
OnClick = "Action"

[[layer]]
Text = "TGL"
Action = [ "LeftMeta", "Tab" ]
OnClick = "Action"

[[layer]]
Text = "OVR"
Action = [ "LeftMeta" ]
OnClick = "Action"

[[layer]]
Text = "RUN"
Action = [ "LeftMeta", "Space" ]
OnClick = "Action"

[[layer]]
Text = "ESC"
Action = "Esc"
OnClick = "Action"